[versions]
# ─────────────────────────────────────────────────────────────────────────────
# Kolt KMP catalog — VERSIONS ONLY.
# Library coordinates live in the convention plugin (hardcoded in
# KmpLibraryCoordinates.kt); the plugin reads versions back from here by alias.
# Bump a version here to upgrade a single project without changing the plugin.
# The kolt runtime libs are pinned by the BOM the plugin injects.
# ─────────────────────────────────────────────────────────────────────────────

# SDK & tooling
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
javaVersion = "21"
agp = "8.13.1"
versionCode = "1"
versionName = "1.0.0"

# Plugin version — replaced by the Constants generator at build time
kmpKolt = "PLUGIN_VERSION"

# KMP core
kotlin = "2.3.10"
coroutines = "1.10.1"

# Compose Multiplatform
# Was 1.8.0 — stale enough that compose-kmp linked against a material3 build
# incompatible with consumers on newer Compose (NoSuchMethodError on
# ExposedDropdownMenuBox in KoltLibs/libs/location-picker's desktop ManualEntryForm,
# surfaced once Panchangam's settings.gradle.kts started resolving compose-kmp to
# this composite build's live source instead of a stale ~/.m2 jar). Matches
# Panchangam's own pin (same Kotlin 2.3.10 either way).
composeMultiplatform = "1.10.3"
# material3 does NOT publish under the same version number as the rest of Compose
# Multiplatform (runtime/foundation/ui) — KmpLibraryCoordinates.kt and
# KmpApplicationConventionPlugin.kt used to assume it did, requesting a
# nonexistent "material3:1.10.3". This is the real compatible release for
# composeMultiplatform 1.10.3.
composeMaterial3 = "1.10.0-alpha05"

# Navigation (official CMP navigation)
navigationCompose = "2.9.2"

# Koin
koin = "4.0.4"
koinAnnotations = "2.0.0"
ksp = "2.3.6"

# Ktor
ktor = "3.1.3"

# Ktorfit (Retrofit-style annotations over Ktor)
ktorfit = "2.7.2"

# SQLDelight (stable, SQL-first KMP persistence)
sqlDelight = "2.0.2"

# Room KMP (3.x alpha — group is still androidx.room, independent of sqlite-bundled)
room3 = "3.0.0-alpha01"
# SQLite bundled driver — independent versioning from Room
sqliteBundled = "2.5.0-alpha01"

# DataStore KMP
datastore = "1.1.4"

# Serialization
kotlinxSerialization = "1.8.1"
kotlinxDatetime = "0.7.1"

# Retrofit (Android-only; usable in androidMainImplementation of KMP modules)
retrofit = "2.11.0"
okhttpLogging = "4.12.0"
chucker = "4.2.0"

# Testing
turbine = "1.2.0"

# Added by kolt plugin 0.1.6.dev-00
korner = "2.0.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqlDelight" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# KoltX KMP Convention Plugins (supports kmp-* and kolt-kmp-* aliases)
kmp-library = { id = "io.github.keltstone.kolt.kmp.library", version.ref = "kmpKolt" }
kmp-library-compose = { id = "io.github.keltstone.kolt.kmp.library-compose", version.ref = "kmpKolt" }
kmp-library-koin = { id = "io.github.keltstone.kolt.kmp.library-koin", version.ref = "kmpKolt" }
kmp-library-koin-compose = { id = "io.github.keltstone.kolt.kmp.library-koin-compose", version.ref = "kmpKolt" }
kmp-data = { id = "io.github.keltstone.kolt.kmp.data", version.ref = "kmpKolt" }
kmp-application = { id = "io.github.keltstone.kolt.kmp.application", version.ref = "kmpKolt" }

kolt-kmp-library = { id = "io.github.keltstone.kolt.kmp.library", version.ref = "kmpKolt" }
kolt-kmp-library-compose = { id = "io.github.keltstone.kolt.kmp.library-compose", version.ref = "kmpKolt" }
kolt-kmp-library-koin = { id = "io.github.keltstone.kolt.kmp.library-koin", version.ref = "kmpKolt" }
kolt-kmp-library-koin-compose = { id = "io.github.keltstone.kolt.kmp.library-koin-compose", version.ref = "kmpKolt" }
kolt-kmp-data = { id = "io.github.keltstone.kolt.kmp.data", version.ref = "kmpKolt" }
kolt-kmp-application = { id = "io.github.keltstone.kolt.kmp.application", version.ref = "kmpKolt" }
